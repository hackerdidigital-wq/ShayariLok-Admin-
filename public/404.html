<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shayari Lok Admin Panel</title>
    <script>
      (function () {
        var base = '/ShayariLok-Admin/';
        var pathname = window.location.pathname || '/';
        var subPath = pathname.indexOf(base) === 0
          ? pathname.slice(base.length).replace(/^\/+/, '')
          : '';
        var hash = window.location.hash || '';
        var target = base + (hash ? hash : subPath ? '#/' + subPath : '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
